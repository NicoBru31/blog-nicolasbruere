name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A newer PR push cancels the stale run; on main, deploys queue instead of being cut mid-upload.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Personal project: Bun canary (needed for `bun lint`). If a run fails with no code
      # change, a fresh canary usually fixes it: re-run the job.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - run: bun install --frozen-lockfile
      # Types for `import … from 'content-collections'` (git-ignored, normally written by the
      # Vite build): lint and type check need them before the build runs.
      - run: bun run gen:content
      - run: bun run format:check
      - run: bun run lint # annotates the PR diff automatically on GitHub Actions
      - run: bun run check
      - run: bun test
      - run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/client
          retention-days: 7

      # Pushes to main publish the build checked above. Runtime secrets (SUPABASE_*) live on the
      # Worker (`wrangler secret put`) and survive deploys.
      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

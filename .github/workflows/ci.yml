name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Personal project: Bun canary (needed for `bun lint`). If a run fails with no code
      # change, a fresh canary usually fixes it: re-run the job.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint # annotates the PR diff automatically on GitHub Actions
      - run: bun run check
      - run: bun test
      - run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/client
          retention-days: 7

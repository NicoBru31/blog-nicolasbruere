[install]
exact = true

[test]
root = "./src"
coverageSkipTestFiles = true

[lint]
typeAware = true
ignorePatterns = ["src/routeTree.gen.ts", ".content-collections/", "src/highlight.css", "dist/"]

[lint.rules]
"eqeqeq" = ["error", "smart"]

[fmt]
# Regenerated by TanStack Router on every build: formatting it would only create diffs.
ignorePatterns = ["src/routeTree.gen.ts"]
printWidth = 100
semi = false
singleQuote = true
